[package]
name = "onioncloud-ll-cell-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary.workspace = true
futures-util.workspace = true
libfuzzer-sys.workspace = true
pin-project.workspace = true
zerocopy.workspace = true

[dependencies.base64ct]
workspace = true
features = ["alloc"]

[dependencies.tracing]
workspace = true
features = ["max_level_off"]

[dependencies.onioncloud-ll-cell]
path = ".."

[dependencies.onioncloud-tart]
path = "../../tart"

[[bin]]
name = "create2_cell"
path = "fuzz_targets/create2_cell.rs"
test = false
doc = false
bench = false

[[bin]]
name = "create2_new"
path = "fuzz_targets/create2_new.rs"
test = false
doc = false
bench = false

[[bin]]
name = "padding"
path = "fuzz_targets/padding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "print_cell"
path = "fuzz_targets/print_cell.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_write"
path = "fuzz_targets/read_write.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vpadding"
path = "fuzz_targets/vpadding.rs"
test = false
doc = false
bench = false
