[package]
name = "onioncloud-ll-cell-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary.workspace = true
futures-util.workspace = true
libfuzzer-sys.workspace = true
pin-project.workspace = true

[dependencies.tracing]
workspace = true
features = ["max_level_off"]

[dependencies.onioncloud-ll-cell]
path = ".."

[dependencies.onioncloud-tart]
path = "../../tart"

[[bin]]
name = "read_write"
path = "fuzz_targets/read_write.rs"
test = false
doc = false
bench = false
